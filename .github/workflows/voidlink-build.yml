name: Build VoidLink IPA

# VoidLink Integration 分支需要 iOS 26 SDK（VTFrameProcessor / VTLowLatencyFrameInterpolation* / hidesSharedBackground）
# 因此必须用 macOS 26 runner（Xcode 26），macos-15 的 Xcode 16.4 会编译失败。

on:
  workflow_dispatch:
  push:
    branches: [ "Integration" ]

jobs:
  build:
    name: Build VoidLink IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 26
        run: |
          set -e
          cur=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "default Xcode: $cur"
          if [ "${cur%%.*}" -lt 26 ]; then
            for app in $(ls -d /Applications/Xcode*.app | sort -rV); do
              v=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
              echo "found $app -> $v"
              case "$v" in
                26.*) sudo xcode-select -s "$app"; break ;;
              esac
            done
          fi
          xcodebuild -version

      - name: Build (unsigned archive)
        run: |
          set -euo pipefail
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/VoidLink.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED="NO" \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/IPA/Payload
          cp -R build/VoidLink.xcarchive/Products/Applications/VoidLink.app build/IPA/Payload/
          cd build/IPA
          zip -qry ../VoidLink-unsigned.ipa Payload
          ls -lh ../VoidLink-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-unsigned-ipa
          path: build/VoidLink-unsigned.ipa
          if-no-files-found: error
